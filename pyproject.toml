[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complex-translator"
version = "0.1.0"
description = "A complex translator package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Dnyan Mudugar", email = "dnyan.mudugar@yahoo.com"},
]
dependencies = [
    transformers>=4.40.0
    torch>=2.2.0
    pandas>=2.2.0
    pytest>=7.0.0

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]