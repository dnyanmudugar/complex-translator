[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
description = "An advanced multilingual neural machine translation package with custom WordPiece subword tokenization."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# This links your project's dependencies directly to your requirements.txt
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",   # For running tests
    "black>=23.0.0",   # For formatting code
]

[project.scripts]
complex-translate = "run:main"

[project.urls]
"Homepage" = "https://github.com"
"Bug Tracker" = "https://github.com/issues"
