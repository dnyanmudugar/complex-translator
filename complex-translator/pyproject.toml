[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "complex-translator"
version = "0.0.2"  # Set explicitly to completely avoid VCS sub-process glitches
description = "A neural machine translation project"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch",
    "pandas",
    "pytest",
    "sentencepiece",
    "transformers",
    "scikit-learn",
]

[tool.setuptools]
packages = ["complex_translator"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com"
Issues = "https://github.com/issues"
Repository = "https://github.com.git"