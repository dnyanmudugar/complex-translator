name: Deploy Pipeline Trigger

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch: # Allows you to click "Run workflow" manually

jobs:
  trigger_production:
    # 🔗 CONNECT TO PRODUCTION WORKFLOW HERE
    # Only execute on version tags or manual runs
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/production.yml # Relative path to your production file
