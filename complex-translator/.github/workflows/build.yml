name: Build Package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Speeds up subsequent runs by caching dependencies

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        # Manually install the dependencies listed in your pyproject.toml [build-system] requires
        python -m pip install setuptools wheel

    - name: Build package
      run: python -m build --no-isolation

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/ # Saves your generated .whl and .tar.gz files
