name: CI & Publish to PyPI

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch: # <-- Add this line here to enable the manual "Run workflow" button

jobs:
      # --- 1. TESTING JOB ---
    - name: Install dependencies
      # Forces this specific step to run inside your subfolder
      working-directory: ./complex-translator
      run: |
        python -m pip install --upgrade pip
        python -m pip install .

    - name: Run unit tests
      working-directory: ./complex-translator
      run: |
        python -m pip install -e .
        python -m pytest

  # --- 2. DEPLOY JOB ---
  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write # Required for PyPI Trusted Publishing

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build hatchling

    - name: Build package distributions
      # Forces the build engine to run directly next to pyproject.toml
      working-directory: ./complex-translator
      run: python -m build --no-isolation

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # Directs the publisher to the dist/ folder that was generated inside your subfolder
        packages-dir: complex-translator/dist/
