name: CI & Publish to PyPI

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

jobs:
  test_and_build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools & dependencies
      run: |
        python -m pip install --upgrade pip
        # Added setuptools and wheel to support the new build backend explicitly
        python -m pip install build setuptools wheel pytest pytest-custom-exit-code

    - name: Run unit tests
      working-directory: ./complex-translator
      run: |
        python -m pytest --suppress-no-test-exit-code

    - name: Build package
      run: python -m build --no-isolation

    - name: Upload built packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: test_and_build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      id-token: write # Required for PyPI Trusted Publishing OIDC
    steps:
    - name: Download built packages
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Install build tools & dependencies
      run: |
        python -m pip install --upgrade pip
        # Added setuptools-scm to ensure dynamic version extraction works smoothly
        python -m pip install build setuptools wheel setuptools-scm pytest pytest-custom-exit-code

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
