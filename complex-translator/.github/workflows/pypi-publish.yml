name: CI & Publish to PyPI

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies and build
      run: |
        python -m pip install --upgrade pip
        python -m pip install build
        python -m build --no-isolation
        - name: Run unit tests
          working-directory: ./complex-translator
          # The flag prevents exit code 5 when no tests exist
          run: |
            python -m pytest --suppress-no-test-exit-code

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write # Required for PyPI Trusted Publishing

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # THIS STEP IS CRITICAL: It installs the runner build tools
      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build setuptools wheel

      # Optional: If your project dependencies are needed for --no-isolation
      - name: Install build dependencies and build
        run: |
          python -m pip install --upgrade pip
          # 1. Install the build CLI tool
          python -m pip install build
          # 2. MANUALLY install whatever is in your pyproject.toml [build-system] requires
          # For example, if you use hatchling, setuptools, or flit:
          python -m pip install setuptools wheel 
          # 3. Run the build
          python -m build --no-isolation

      # This will now succeed because the 'build' package exists on the runner
      - name: Build Python Package
        run: python -m build --no-isolation

