name: CI & Publish to PyPI

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build hatchling
        python -m pip install -e .
        - name: Run unit tests
          working-directory: ./complex-translator
          # The flag prevents exit code 5 when no tests exist
          run: |
            python -m pytest --suppress-no-test-exit-code

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write # Required for PyPI Trusted Publishing

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # MAKE SURE THIS STEP IS INCLUDED IN DEPLOY:
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build hatchling

    - name: Build package distributions
      working-directory: ./complex-translator
      run: python -m build --no-isolation

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: complex-translator/dist/
