name: CI & Publish to PyPI

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch: # <-- Add this line here to enable the manual "Run workflow" button

jobs:
  # 1. Run your unit tests first
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs your dependencies (torch, pandas) from pyproject.toml
        python -m pip install ./complex-translator

    - name: Run unit tests
      run: |
        python -m pytest

  # 2. Build and publish to PyPI (Only runs if tests pass)
  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write # Required for PyPI Trusted Publishing

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build hatchling

    - name: Build package distributions
      run: python -m build --no-isolation

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
