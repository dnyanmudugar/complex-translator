name: Python Build and Deploy

on:
  push:
    branches: [ "main" ] # Triggers every time you push to the main branch
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Automatically caches dependencies to speed up future runs

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build Python Package
        # This now executes directly in your repository root
        run: python -m build
