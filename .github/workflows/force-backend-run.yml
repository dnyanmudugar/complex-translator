name: Force New Backend Run

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    # If your Trusted Publisher uses an environment, leave this. 
    # If your Trusted Publisher has "Environment: None", DELETE this line!
    environment: pypi 
    
    permissions:
      id-token: write    
      contents: read     

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Dynamic Directory Mapping and Build
        run: |
          REAL_PATH=$(find . -maxdepth 3 -type d -name "complex-translator" -print -quit)
          cd "$REAL_PATH"

          # ⚠️ CHANGE "complex-translator" BELOW TO YOUR EXACT PYPI REGISTERED PROJECT NAME
          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"  # 👈 Edit this name to match PyPI perfectly!
version = "0.1.0"
dependencies = []
EOF

          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install .
          python -m build --no-isolation

          # Relocate packages to the main workspace root for PyPI container access
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv dist/* "$GITHUB_WORKSPACE/dist/"
          
          echo "📦 Current built packages ready for upload:"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: 4. Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # 🔍 Turning on debug printing to catch the exact claim mismatch inside the container logs
          print-hash: true
