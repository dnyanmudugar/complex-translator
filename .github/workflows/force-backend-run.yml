name: Force New Backend Run

on:
  push:
    branches: [ "**" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    environment: pypi 
    
    permissions:
      id-token: write    # Required for Trusted Publishing OIDC token
      contents: read     # Required to clone your codebase

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Dynamic Directory Mapping and Build
        run: |
          REAL_PATH=$(find . -maxdepth 3 -type d -name "complex-translator" -print -quit)
          echo "📍 Project found at: $REAL_PATH"
          cd "$REAL_PATH"

          # ⚙️ Inject configuration files locally inside the subfolder
          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF

          # 🛠️ Upgrade core dependencies
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install .
          
          # 📦 Compile the package inside the subfolder
          python -m build --no-isolation

          # 🚚 CRITICAL STEP: Relocate the built files to the main workspace root
          echo "Moving artifacts out of isolation..."
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv dist/* "$GITHUB_WORKSPACE/dist/"

      - name: 4. Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Tells the PyPI container exactly where the files were relocated
          packages-dir: dist/
