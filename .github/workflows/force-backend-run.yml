name: Force New Backend Run

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write    # Grants OIDC permissions to exchange token
      contents: read     # Grants checkout permissions

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Isolate Path and Build Package
        run: |
          REAL_PATH=$(find . -maxdepth 3 -type d -name "complex-translator" -print -quit)
          cd "$REAL_PATH"

          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF

          python -m pip install --upgrade pip setuptools wheel build twine
          python -m pip install .
          python -m build --no-isolation

          # Relocate packages to the main workspace root
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv dist/* "$GITHUB_WORKSPACE/dist/"

      # 🚀 FIX: Uses a standard Python library tool instead of a hidden Docker action
      - name: 4. Publish to PyPI via Twine CLI Tool
        run: |
          # Fetch the short-lived security token explicitly via GitHub Actions core API
          ACTIONS_ID_TOKEN_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL"
          ACTIONS_ID_TOKEN_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          
          echo "🔐 Requesting token authority from OIDC..."
          OIDC_TOKEN=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi" | jq -r '.value')
          
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" == "null" ]; then
            echo "❌ Failed to retrieve authentication claim from GitHub!"
            exit 1
          fi

          echo "📦 Launching transparent upload program..."
          python -m twine upload \
            -u __token__ \
            -p "$OIDC_TOKEN" \
            "$GITHUB_WORKSPACE/dist/*"
