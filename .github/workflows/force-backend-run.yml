name: Force New Backend Run

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write    # Grants OIDC permissions to exchange token
      contents: read     # Grants checkout permissions

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Isolate Path and Build Package
        run: |
          echo "🔍 Searching for your project folder layout..."
          # Case-insensitive find to capture variations like 'Complex-Translator' or 'complex-translator'
          REAL_PATH=$(find . -maxdepth 4 -type d -iname "complex-translator" -print -quit)
          
          if [ -z "$REAL_PATH" ]; then
            echo "❌ CRITICAL: Could not find 'complex-translator' anywhere in this workspace."
            echo "Printing current directory tree layout to help you verify:"
            ls -R
            exit 1
          fi
          
          echo "✅ Target path successfully discovered at: $REAL_PATH"
          cd "$REAL_PATH"

          # Programmatically generate packaging configurations locally inside the target folder
          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF

          echo "🛠️ Installing environment build core toolsets..."
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install .
          python -m build --no-isolation

          # Relocate packages to the main workspace root for the PyPI action
          echo "🚚 Transferring built packages to target workspace distribution folders..."
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv dist/* "$GITHUB_WORKSPACE/dist/"

      - name: 4. Publish Distribution Packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
