name: Force New Backend Run

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write    # Grants OIDC permissions to exchange token
      contents: read     # Grants checkout permissions

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Isolate Path and Build Package
        run: |
          # 1. Check if the directory exists, and move inside it
          if [ -d "./complex-translator" ]; then
            cd ./complex-translator
          elif [ -d "./src/complex-translator" ]; then
            cd ./src/complex-translator
          else
            echo "❌ CRITICAL: Could not find complex-translator folder."
            ls -R
            exit 1
          fi

          echo "📍 Current working directory confirmed: $(pwd)"

          # 2. Inject the pyproject.toml right here inside the folder
          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF
          echo "✅ pyproject.toml generated inside $(pwd)"

          # 3. Upgrade your tools locally
          python -m pip install --upgrade pip setuptools wheel build

          # 4. Build the project using a dot '.' instead of a path
          python -m build --no-isolation

          # 5. Move the built packages to the root workspace for PyPI
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv dist/* "$GITHUB_WORKSPACE/dist/"
