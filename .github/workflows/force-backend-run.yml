name: Force New Backend Run

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    # Do not add an "environment:" line here since it was left blank on PyPI
    
    permissions:
      id-token: write    # Grants OIDC permissions to exchange token
      contents: read     # Grants checkout permissions

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Isolate Path and Build Package
        run: |
          REAL_PATH=$(find . -maxdepth 3 -type d -name "complex-translator" -print -quit)
          cd "$REAL_PATH"

          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF

          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install .
          python -m build --no-isolation

          # Relocate packages to the main workspace root for the PyPI action
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv dist/* "$GITHUB_WORKSPACE/dist/"

      - name: 4. Publish Distribution Packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true  # Forces full server log output if an issue arises
