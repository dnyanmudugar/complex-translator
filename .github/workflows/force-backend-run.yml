name: Production Backend Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    # 🔐 CRITICAL: Allows PyPI to cryptographically verify your runner identity
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Initialize Production Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Package Artifacts
        run: |
          cd ./src/complex-translator
          
          # Inject configurations dynamically
          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF

          python -m pip install --upgrade pip setuptools wheel build
          python -m build --no-isolation

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password secrets needed; uses the OIDC permission block above!
