name: Production Backend Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch: # Allows manual triggering from the UI or CLI

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python -m pip install build wheel pytest

    - name: Monolithic Environment Assembly and Package Build
      run: |
        # Explicitly move into the subfolder first
        cd ./src/complex-translator
        
        # Upgrade pip and core packaging tools
        python -m pip install --upgrade pip setuptools wheel build pytest
        
        # Install the local directory package safely
        python -m pip install .
        
        # Run tests and trigger the monolithic build
        python -m pytest
        python -m build --no-isolation

    - name: Publish Distribution Packages to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
