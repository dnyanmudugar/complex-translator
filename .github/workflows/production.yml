name: Production Backend Pipeline

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  workflow_dispatch: # Allows manual triggering from the UI or CLI

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python -m pip install build wheel pytest

    - name: Monolithic Environment Assembly and Run Tests
      run: |
        cd ./complex-translator
        
        # 1. Upgrade pip and install testing framework
        python -m pip install --upgrade pip pytest
        
        # 2. Run your tests directly without installing the directory
        python -m pytest

    - name: Build Distribution Packages
      run: python -m build ./complex-translator

    - name: Publish Distribution Packages to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
