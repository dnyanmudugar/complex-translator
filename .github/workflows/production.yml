name: Python Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. Clones your code into the runner (prevents directory missing errors)
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Sets up a clean Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Upgrades pip and installs packages explicitly (No requirements.txt needed)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add your packages below separated by spaces. If you don't need any, delete this step.
          pip install requests pandas

      # 4. Executes your Python code
      - name: Run script
        run: python main.py  # Replace main.py with your actual file name
