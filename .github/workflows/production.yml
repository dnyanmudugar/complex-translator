name: Production Backend Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*', '[0-9]*']
  workflow_dispatch: # Allows manual triggering from the UI or CLI

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Initialize Python 3.10 Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Monolithic Environment Assembly and Package Build
      # Tell GitHub to look inside the subfolder where pyproject.toml actually sits!
      working-directory: ./complex-translator
      run: |
        python -m pip install --upgrade pip
        python -m pip install build setuptools wheel pytest
        python -m pip install .
        python -m pytest
        python -m build --no-isolation

    - name: Publish Distribution Packages to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
