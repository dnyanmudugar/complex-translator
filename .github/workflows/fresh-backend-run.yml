name: Fresh Backend Run Program

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    
      contents: read     

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Isolate Path and Build Package
        run: |
          echo "🔍 Searching for your project folder path..."
          
          # 1. Determine the true path and save it to a variable
          if [ -d "./complex-translator" ]; then
            TARGET_PATH="./complex-translator"
          elif [ -d "./src/complex-translator" ]; then
            TARGET_PATH="./src/complex-translator"
          else
            echo "❌ CRITICAL error: 'complex-translator' folder not found."
            ls -R
            exit 1
          fi

          echo "✅ Target path verified: $TARGET_PATH"

          # 2. Inject the pyproject.toml directly into that target path
          cat << 'EOF' > "$TARGET_PATH/pyproject.toml"
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF
          echo "✅ pyproject.toml generated inside $TARGET_PATH"

          # 3. Upgrade setup dependencies
          python -m pip install --upgrade pip setuptools wheel build

          # 4. Explicitly tell the build tool to compile that specific folder path
          python -m build "$TARGET_PATH" --no-isolation

          # 5. Relocate build distributions out of the target folder to workspace root
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$TARGET_PATH/dist"/* "$GITHUB_WORKSPACE/dist/"
          echo "🚚 Build artifacts relocated to global workspace distribution root."
