name: Fresh Backend Run Program

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write    # Required for Trusted Publishing OIDC token authentication
      contents: read     # Required to checkout the source code

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Dynamic Path Discovery and Hermetic Assembly
        run: |
          echo "🔍 Commencing systemic repository scan for complex-translator workspace..."
          
          # Find the actual path dynamically, bypassing upper/lowercase differences
          REAL_PATH=$(find . -maxdepth 4 -type d -iname "complex-translator" -print -quit)
          
          if [ -z "$REAL_PATH" ]; then
            echo "❌ CRITICAL: Target subfolder 'complex-translator' could not be found!"
            echo "=== VISUALIZING WORKSPACE MAP ==="
            ls -R
            exit 1
          fi
          
          echo "✅ Discovered active folder target at: $REAL_PATH"

          # Programmatically generate packaging configurations locally inside the discovered path
          cat << 'EOF' > "$REAL_PATH/pyproject.toml"
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF
          echo "✅ Critical packaging architecture compiled inside target destination directory."

          # Bootstrap required compilation tools
          python -m pip install --upgrade pip setuptools wheel build

          # Compile the discovered directory dynamically (No hardcoded paths)
          python -m build "$REAL_PATH" --no-isolation

          # Relocate packages to the main workspace root for the PyPI upload container
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$REAL_PATH/dist"/* "$GITHUB_WORKSPACE/dist/"
          echo "🚚 Build artifacts routed out of isolation to global workspace distribution root."

      - name: 4. Publish Distribution Packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
