name: Fresh Backend Run Program

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    
      contents: read     

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Isolate Path and Build Package
        run: |
          echo "🔍 Hunting for 'complex-translator' folder anywhere in the repository..."
          
          # Find the real path dynamically, ignoring case sensitivity
          REAL_PATH=$(find . -maxdepth 4 -type d -iname "complex-translator" -print -quit)
          
          if [ -z "$REAL_PATH" ]; then
            echo "❌ CRITICAL: Could not find any folder named 'complex-translator'."
            echo "=== CURRENT REPOSITORY MAP ==="
            ls -R
            exit 1
          fi
          
          echo "✅ Target path successfully discovered at: $REAL_PATH"

          # Inject the pyproject.toml directly into the discovered path
          cat << 'EOF' > "$REAL_PATH/pyproject.toml"
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF
          echo "✅ pyproject.toml generated inside $REAL_PATH"

          # Upgrade setup dependencies
          python -m pip install --upgrade pip setuptools wheel build

          # Build the discovered path explicitly
          python -m build "$REAL_PATH" --no-isolation

          # Relocate build distributions to workspace root for PyPI
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$REAL_PATH/dist"/* "$GITHUB_WORKSPACE/dist/"
          echo "🚚 Build artifacts relocated to global workspace distribution root."
