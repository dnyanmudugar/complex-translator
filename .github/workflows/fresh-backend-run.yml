name: Fresh Backend Run Program

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    
      contents: read     

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Isolate Path and Build Package
        run: |
          if [ -d "./complex-translator" ]; then
            cd ./complex-translator
          elif [ -d "./src/complex-translator" ]; then
            cd ./src/complex-translator
          else
            echo "? CRITICAL error: 'complex-translator' folder not found."
            ls -R
            exit 1
          fi

          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF

          python -m pip install --upgrade pip setuptools wheel build
          python -m build --no-isolation
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv dist/* "$GITHUB_WORKSPACE/dist/"

      - name: 4. Publish Distribution Packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
