name: Fresh Backend Run Program

on:
  push:
    branches: [ "main" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write    
      contents: read     

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Isolate Path and Build Package
        run: |
          echo "?? Hunting for your project folder layout..."
          REAL_PATH=$(find . -maxdepth 4 -type d -iname "complex-translator" -print -quit)
          
          if [ -z "$REAL_PATH" ]; then
            echo "? CRITICAL: Could not find any folder named 'complex-translator'."
            echo "=== CURRENT REPOSITORY MAP ==="
            ls -R
            exit 1
          fi
          
          echo "? Target path successfully discovered at: $REAL_PATH"

          # Programmatically generate packaging configurations locally inside the target folder
          cat << 'EOF' > "$REAL_PATH/pyproject.toml"
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF
          echo "? pyproject.toml generated inside $REAL_PATH"

          python -m pip install --upgrade pip setuptools wheel build
          python -m build "$REAL_PATH" --no-isolation

          mkdir -p "$GITHUB_WORKSPACE/dist"
          mv "$REAL_PATH/dist"/* "$GITHUB_WORKSPACE/dist/"

      - name: 4. Publish Distribution Packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
