name: Publish to PyPI

on:
  push:
    tags:
      - 'v*' # Triggers the workflow whenever you push a version tag like v1.0.0

jobs:
  build-and-publish:
    name: Build and Publish Python Package
    runs-on: ubuntu-latest
    
    # REQUIRED for Trusted Publishing / OIDC authentication
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build Package
      run: python -m build # Compiles your code into dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1 # Official PyPA publishing action
