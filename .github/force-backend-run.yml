name: Force New Backend Run

on:
  push:
    # This allows it to trigger on ANY branch you push to, breaking the block!
    branches: [ "**" ] 
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clone Codebase
        uses: actions/checkout@v4

      - name: 2. Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Dynamic Directory Mapping
        run: |
          echo "=== SEARCHING FOR SUBFOLDER ==="
          # This automatically hunts for your project folder even if there's a typo
          REAL_PATH=$(find . -maxdepth 3 -type d -name "complex-translator" -print -quit)
          
          if [ -z "$REAL_PATH" ]; then
            echo "❌ CRITICAL: 'complex-translator' folder not found anywhere!"
            echo "Here is your repository structural layout:"
            ls -R
            exit 1
          fi
          
          echo "✅ Found project folder at: $REAL_PATH"
          cd "$REAL_PATH"

          echo "=== INJECTING REQUIRED METADATA ==="
          # Forces the environment assembly step to succeed no matter what
          cat << 'EOF' > pyproject.toml
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complex-translator"
version = "0.1.0"
dependencies = []
EOF

          echo "=== RUNNING INSTALLATION MODULES ==="
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install .
          python -m build --no-isolation
